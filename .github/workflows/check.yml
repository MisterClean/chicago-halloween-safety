name: Check source project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run --locked python -m compileall -q pipeline.py scripts packages/data/scripts
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked python scripts/check_public_files.py
      - run: node --check apps/web/public/chicago-halloween-safety.js
      - run: git diff --check
